name: Uji

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pustaka sistem untuk gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Pasang paket (tanpa GUI)
        run: pip install numpy scipy gmsh pytest
      - name: Jalankan uji
        run: python -m pytest -q tests
